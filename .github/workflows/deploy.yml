- name: Clean old deployment
  run: sudo rm -rf /var/www/portfolio/*

- name: Deploy Project

  on:
    push:
      branches:
        - main

  jobs:
    deploy:
      runs-on: ubuntu-latest
      container:
        image: node:22
      steps:
        - uses: actions/checkout@v3
          with:
            node-version: 22
        - run: npm ci
        - run: npm run build

- name: Deploy new build
  run: sudo cp -r dist/* /var/www/portfolio/
