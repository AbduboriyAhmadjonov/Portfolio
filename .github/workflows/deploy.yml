name: Build & Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean previous build
        run: rm -rf dist/

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Clean production folder
        run: sudo rm -rf /var/www/portfolio_prod/*

      - name: Deploy new build
        run: sudo cp -r dist/* /var/www/portfolio_prod/
